# ─── Template sensore ──────────────────────────────────────────────────────────
x-sensor-factory: &sensor-factory
  build: ./factory_coap
  networks:
    - factory_net
  restart: unless-stopped

x-sensor-fridge: &sensor-fridge
  build: ./fridge_mqtt
  networks:
    - fridge_net
  restart: unless-stopped

networks:
  # Nomi espliciti: il container chaos li usa via docker CLI
  # e non vuole conoscere il prefisso del progetto.
  wan_simulated_net:
    name: wan_simulated_net
    driver: bridge
  factory_net:
    name: factory_net
    driver: bridge
  fridge_net:
    name: fridge_net
    driver: bridge

volumes:
  influxdb_data:

services:

  # ── Traefik (reverse proxy: routing per nome host) ─────────
  # Tutti i web UI sono raggiungibili via http://<nome>.localhost
  # invece di memorizzare le porte. Su Windows *.localhost
  # risolve automaticamente a 127.0.0.1.
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"          # dashboard senza auth (solo lab)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"        # entrypoint HTTP per tutti i servizi web
      - "8080:8080"    # dashboard Traefik → http://traefik.localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wan_simulated_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"

  # ── Factory Sensors ────────────────────────────────────
  # ── Using CoAP ────────────────────────────────────
  sensor-factory-01:
    <<: *sensor-factory
    container_name: factory01
    environment:
      SENSOR_ID: factory01

  sensor-factory-02:
    <<: *sensor-factory
    container_name: factory02
    environment:
      SENSOR_ID: factory02

  sensor-factory-03:
    <<: *sensor-factory
    container_name: factory03
    environment:
      SENSOR_ID: factory03

  sensor-factory-04:
    <<: *sensor-factory
    container_name: factory04
    environment:
      SENSOR_ID: factory04

  sensor-factory-05:
    <<: *sensor-factory
    container_name: factory05
    environment:
      SENSOR_ID: factory05

  sensor-factory-06:
    <<: *sensor-factory
    container_name: factory06
    environment:
      SENSOR_ID: factory06

  sensor-factory-07:
    <<: *sensor-factory
    container_name: factory07
    environment:
      SENSOR_ID: factory07

  sensor-factory-08:
    <<: *sensor-factory
    container_name: factory08
    environment:
      SENSOR_ID: factory08

  sensor-factory-09:
    <<: *sensor-factory
    container_name: factory09
    environment:
      SENSOR_ID: factory09

  sensor-factory-10:
    <<: *sensor-factory
    container_name: factory10
    environment:
      SENSOR_ID: factory10
  
  # ── Fridge Sensors ────────────────────────────────────
  # ── Using MQTT ────────────────────────────────────
  sensor01:
    <<: *sensor-fridge
    container_name: sensor01
    environment:
      SENSOR_ID: sensor01

  sensor02:
    <<: *sensor-fridge
    container_name: sensor02
    environment:
      SENSOR_ID: sensor02

  sensor03:
    <<: *sensor-fridge
    container_name: sensor03
    environment:
      SENSOR_ID: sensor03

  sensor04:
    <<: *sensor-fridge
    container_name: sensor04
    environment:
      SENSOR_ID: sensor04

  sensor05:
    <<: *sensor-fridge
    container_name: sensor05
    environment:
      SENSOR_ID: sensor05

  sensor06:
    <<: *sensor-fridge
    container_name: sensor06
    environment:
      SENSOR_ID: sensor06

  sensor07:
    <<: *sensor-fridge
    container_name: sensor07
    environment:
      SENSOR_ID: sensor07

  sensor08:
    <<: *sensor-fridge
    container_name: sensor08
    environment:
      SENSOR_ID: sensor08

  sensor09:
    <<: *sensor-fridge
    container_name: sensor09
    environment:
      SENSOR_ID: sensor09

  sensor10:
    <<: *sensor-fridge
    container_name: sensor10
    environment:
      SENSOR_ID: sensor10

  # ── CoAP Gateway ────────────────────────────────────────────
  factory-gateway:
    build: ./factory_gateway
    container_name: factory-gateway
    networks:
      - factory_net
      - wan_simulated_net
    ports:
      - "5683:5683/udp"   # CoAP usa UDP, non TCP!
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      COAP_PORT: 5683
      AMQP_GATEWAY_URL: http://amqp-gateway:8000/factory

  # ── Mosquitto mqtt broker ────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"         # MQTT standard
    volumes:
      - ./mosquitto-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto-broker/data:/mosquitto/data   # persistenza messaggi su disco
      - ./mosquitto-broker/log:/mosquitto/log
    networks:
      - fridge_net          # lato sensori
      - wan_simulated_net            # lato servizi
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ok", "-q", "0"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Telegraf ────────────────────────────────────────────
  gateway:
    image: telegraf:latest
    container_name: mqtt-gateway
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - wan_simulated_net            # SOLO core_net: se si disconnette, perde accesso a tutto
    restart: unless-stopped

  # ── Node-RED (dashboard + alerting) ────────────────────────
  nodered:
    build: ./nodered
    container_name: nodered
    networks:
      - wan_simulated_net
    volumes:
      - ./nodered/data:/data  # flussi e configurazioni persistenti
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nodered.rule=Host(`nodered.localhost`)"
      - "traefik.http.routers.nodered.entrypoints=web"
      - "traefik.http.services.nodered.loadbalancer.server.port=1880"

  # ── InfluxDB v2 (time-series database) ─────────────────────
  influxdb:
    image: influxdb:2
    container_name: influxdb
    networks:
      - wan_simulated_net
    volumes:
      - influxdb_data:/var/lib/influxdb2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.influxdb.rule=Host(`influxdb.localhost`)"
      - "traefik.http.routers.influxdb.entrypoints=web"
      - "traefik.http.services.influxdb.loadbalancer.server.port=8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Mailhog (fake SMTP per test email) ─────────────────────
  # SMTP rimane raggiungibile internamente come mailhog:1025
  # (lo userà l'amqp-gateway per inviare email). La UI passa
  # da Traefik → http://mailhog.localhost
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    networks:
      - wan_simulated_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.localhost`)"
      - "traefik.http.routers.mailhog.entrypoints=web"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  # ── Chaos (ferma e riavvia container per testare la resilienza) ──
  # Usa `docker stop` / `docker start`: niente magia di network,
  # i container ripartono dallo stato cleanly.
  chaos:
    build: ./chaos
    container_name: chaos
    networks:
      - wan_simulated_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DROP_INTERVAL: ${CHAOS_DROP_INTERVAL:-180}
      DROP_DURATION: ${CHAOS_DROP_DURATION:-10}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-true}
    restart: unless-stopped

  # ── amqp-gateway: ricevitore HTTP + invio email a Mailhog ────────────────
  # Espone POST /fridge e POST /factory; controlla soglia e invia
  # email a Mailhog quando temperatura > TEMP_THRESHOLD.
  # NB: non parla AMQP/RabbitMQ — il nome è storico.
  amqp-gateway:
    build: ./amqp-gateway
    container_name: amqp-gateway
    networks:
      - wan_simulated_net
    depends_on:
      - mailhog
    environment:
      HTTP_PORT:       8000
      TEMP_THRESHOLD:  ${TEMP_THRESHOLD:-30.0}
      SMTP_HOST:       mailhog
      SMTP_PORT:       1025
      ALERT_FROM:      ${ALERT_FROM:-iot-gateway@example.com}
      ALERT_TO:        ${ALERT_TO:-ops@example.com}
      COOLDOWN_SECS:   ${COOLDOWN_SECS:-300}
    restart: unless-stopped