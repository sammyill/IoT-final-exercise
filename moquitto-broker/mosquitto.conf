# ============================================================
# mosquitto.conf — Configurazione broker MQTT Eclipse Mosquitto
# ============================================================
# Mosquitto è il cuore dell'infrastruttura IoT: riceve i
# messaggi dai sensori e li distribuisce ai subscriber
# (Telegraf, Node-RED). Con la persistenza abilitata, mette
# in coda i messaggi per i client temporaneamente offline.
# ============================================================

# ---- Listener ----
# Porta standard MQTT (1883). Aggiungere 8883 per TLS in produzione.
listener 1883

# Permette connessioni anonime (OK per laboratorio, NON in produzione)
allow_anonymous true

# ============================================================
# PERSISTENZA DEI MESSAGGI
# ============================================================
# Con persistence=true il broker salva su disco:
#   - le sottoscrizioni dei client con clean_session=false
#   - i messaggi QoS 1/2 in coda per client offline
#   - i messaggi Retained
# Senza questo, un riavvio del broker cancella tutto.
persistence true
persistence_location /mosquitto/data/

# Salva automaticamente ogni 300 secondi
autosave_interval 300

# Salva anche quando il numero di modifiche supera questa soglia
autosave_on_changes true

# ============================================================
# GESTIONE CODE PER CLIENT OFFLINE
# ============================================================
# Numero massimo di messaggi in coda per un client disconnesso.
# Con 10 sensori × 1 msg/5s → 2 msg/s.
# 1000 messaggi = ~8 minuti di buffer per ogni subscriber.
max_queued_messages 1000

# I messaggi QoS 0 NON vengono messi in coda (per design MQTT).
# QoS 0 = "fire and forget", nessuna garanzia di consegna.
queue_qos0_messages false

# Dopo quanto tempo il broker dimentica un client persistente
# che non si è più connesso. 24h è sufficiente per un laboratorio.
persistent_client_expiration 24h

# ============================================================
# LOGGING
# ============================================================
# Livelli disponibili: debug, info, notice, warning, error
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type warning
log_type error
log_type information
log_timestamp true
