# ============================================================
# telegraf.conf — Gateway IoT: MQTT → InfluxDB
# ============================================================
# Telegraf agisce da "gateway" tra i sensori MQTT e il database.
# Si sottoscrive ai topic dei sensori con QoS=1 e sessione
# persistente: se si disconnette da Mosquitto, i messaggi vengono
# messi in coda e consegnati alla riconnessione (zero perdita).
# ============================================================

# ---- Configurazione agente ----
[agent]
  # Intervallo di raccolta dati
  interval = "10s"

  # Allinea la raccolta all'ora esatta (es. :00, :10, :20...)
  round_interval = true

  # Dimensione del batch prima di inviare a InfluxDB
  metric_batch_size = 1000

  # Intervallo di flush verso l'output (InfluxDB)
  flush_interval = "10s"

  # Variazione casuale sul flush per evitare burst sincronizzati
  flush_jitter = "2s"

  # Hostname usato come tag di default in tutti i metric
  hostname = "telegraf-gateway"

  # Non aggiungere automaticamente il tag host (lo gestiamo noi)
  omit_hostname = false

# ============================================================
# INPUT: Sottoscrizione MQTT
# ============================================================
[[inputs.mqtt_consumer]]

  # URI del broker Mosquitto (dentro la rete Docker usa il nome del servizio)
  servers = ["tcp://mosquitto:1883"]

  # Wildcard '+' = qualsiasi segmento singolo.
  # Es: iot/aula/sensor01/temperatura, iot/aula/sensor10/temperatura
  topics = ["fridge"]

  # QoS=1: il broker garantisce la consegna almeno una volta.
  # Con QoS=0 un messaggio perso durante una disconnessione è perso per sempre.
  qos = 1

  # Sessione persistente: il broker mette in coda i messaggi
  # mentre Telegraf è disconnesso e li invia al reconnect.
  persistent_session = true

  # client_id DEVE essere univoco sul broker e stabile (non random)
  # per permettere il ripristino della sessione persistente.
  client_id = "telegraf-iot-gateway"

  # Formato del payload dei sensori: JSON
  data_format = "json"

  # Precision del timestamp JSON (epoch in secondi → "s")
  # Il sensore invia time.time() che è float in secondi
  json_time_key    = "timestamp"
  json_time_format = "unix"

  # Campi numerici da estrarre come field values
  json_string_fields = ["sensor_id"]

  # Campi da promuovere a tag InfluxDB (indicizzati, usati per filtrare)
  tag_keys = ["sensor_id"]

# ============================================================
# OUTPUT: InfluxDB v2
# ============================================================
[[outputs.influxdb_v2]]

  # URL dell'API InfluxDB (dentro Docker: nome servizio + porta)
  urls = ["http://influxdb:8086"]

  # Token di autenticazione (deve coincidere con DOCKER_INFLUXDB_INIT_ADMIN_TOKEN)
  token = "token"

  # Organization e Bucket creati dall'inizializzazione automatica di InfluxDB
  organization = "org"
  bucket       = "bucket"

  # In caso di errore, ritenta fino a X secondi prima di scartare i dati
  timeout = "5s"
